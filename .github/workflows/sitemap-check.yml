name: Sitemap validation

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'scripts/generate_sitemap.py'
      - '.githooks/pre-commit'
      - '.github/workflows/sitemap-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'scripts/generate_sitemap.py'
      - '.githooks/pre-commit'
      - '.github/workflows/sitemap-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify sitemap includes all eligible HTML pages
        run: python scripts/generate_sitemap.py --check
